AWSTemplateFormatVersion: '2010-09-09'
Description: Immich Valkey Traefik EC2 Instance with CloudFront CDN & SSL Security

Parameters:

  InstanceType:
    Type: String
    Default: t4g.nano

  VpcId:
    Type: AWS::EC2::VPC::Id

  SubnetId:
    Type: AWS::EC2::Subnet::Id

  BucketName:
    Type: String

  KeyPair:
    Type: String
    Default: ""

  ImageLocationS3Uri:
    Type: String

  CronScriptsS3URI:
    Type: String

  EnvFileS3URI:
    Type: String

  # --- NEW PARAMETERS FOR SSL & ROUTE 53 ---
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: The Route 53 Public Hosted Zone ID for your domain.

  DomainName:
    Type: String
    Description: The fully qualified domain name for the application (e.g., app.yourdomain.com).

  AcmeEmail:
    Type: String
    Description: Email address used for Let's Encrypt SSL certificate registration.

  S3FilesystemId:
    Type: String

Conditions:
  HasKey: !Not [!Equals [!Ref KeyPair, ""] ]

Resources:

  # --- UPDATED LOCKED DOWN SECURITY GROUP ---
  ImmichAppSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security Group for Traefik
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: SSH access
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Inbound HTTP
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: Inbound HTTPS
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0
          Description: Traefik Dashboard


  # --- YOUR EXISTING IAM CONFIGURATION ---
  ImmichAppInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "Traefik-role-${AWS::AccountId}"

      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/AmazonS3FilesClientFullAccess

      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:HeadObject
                  - s3:PutObject
                Resource:
                  - !Sub arn:aws:s3:::${BucketName}/*
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !Sub arn:aws:s3:::${BucketName}
        - PolicyName: TraefikECSReadAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - "ecs:ListClusters"
                  - "ecs:DescribeClusters"
                  - "ecs:ListTasks"
                  - "ecs:DescribeTasks"
                  - "ecs:ListContainerInstances"
                  - "ecs:DescribeContainerInstances"
                  - "ecs:DescribeTaskDefinition"
                  - "ec2:DescribeInstances"
                Resource: "*"
        - PolicyName: ssm-control

          PolicyDocument:
            Version: '2012-10-17'

            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:PutParameter
                Resource: "*"

        - PolicyName: ecs-control

          PolicyDocument:
            Version: '2012-10-17'

            Statement:
              - Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:ListServices
                  - ecs:UpdateService
                Resource: "*"
        - PolicyName: route53-control

          PolicyDocument:
            Version: '2012-10-17'

            Statement:
              - Effect: Allow
                Action:
                  - route53:ChangeResourceRecordSets
                  - route53:GetChange
                Resource: "*"

  ImmichAppInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref ImmichAppInstanceRole

  # --- YOUR EXISTING EC2 INSTANCE DEFINITION ---
  ImmichAppInstance:
    Type: AWS::EC2::Instance
    Properties:

      ImageId: !Sub "{{resolve:ssm:/aws/service/ecs/optimized-ami/amazon-linux-2023/arm64/recommended/image_id}}"

      InstanceType: !Ref InstanceType

      IamInstanceProfile: !Ref ImmichAppInstanceProfile

      Tags:
        - Key: Name
          Value: !Sub Immich-API-App

      KeyName: !If
        - HasKey
        - !Ref KeyPair
        - !Ref AWS::NoValue

      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required

      NetworkInterfaces:
        - DeviceIndex: 0
          SubnetId: !Ref SubnetId
          GroupSet:
            - !Ref ImmichAppSG

      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: 30
            DeleteOnTermination: true
            Encrypted: true

      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          exec > >(tee /var/log/immich-app.log | logger -t immich-app) 2>&1

          until systemctl is-active --quiet docker; do
            sleep 2
          done
          
          mkdir -p /mnt/immich
          if ! mountpoint -q /mnt/immich; then
            mount -t s3files ${S3FilesystemId}:/ /mnt/immich
            echo "Mounted ${S3FilesystemId} to /mnt/immich"
          fi
          if ! grep -q "${S3FilesystemId}" /etc/fstab; then
            echo "${S3FilesystemId}:/ /mnt/immich s3files _netdev,nofail 0 0" >> /etc/fstab
            echo "Added ${S3FilesystemId} to /etc/fstab"
          fi
          
          dnf install valkey cronie -y
          systemctl enable --now crond
          
          mkdir -p /opt/scheduled /opt/traefik
          
          # Create and set strict permissions for SSL certificate storage
          aws s3 cp ${EnvFileS3URI}/acme.json /opt/traefik/acme.json || touch /opt/traefik/acme.json
          chmod 600 /opt/traefik/acme.json

          aws s3 cp "${CronScriptsS3URI}"/microservice-cache-check.sh /opt/scheduled/microservice-cache-check.sh
          chmod +x /opt/scheduled/microservice-cache-check.sh
          aws s3 cp "${CronScriptsS3URI}"/ml-cache-check.sh /opt/scheduled/ml-cache-check.sh
          chmod +x /opt/scheduled/ml-cache-check.sh
          aws s3 cp "${EnvFileS3URI}"/immich.env /opt/scheduled/var.env
          source /opt/scheduled/var.env   
                  
          aws s3 cp ${ImageLocationS3Uri}/traefik.tar .
          docker load -i traefik.tar
          
          aws s3 cp ${ImageLocationS3Uri}/immich.tar .
          docker load -i immich.tar
          
          cat >/etc/systemd/system/traefik.service <<'EOF'
          [Unit]
          Description=Traefik
          Requires=docker.service
          After=docker.service

          [Service]
          Type=simple
          Restart=always
          RestartSec=5

          ExecStartPre=-/usr/bin/docker rm -f traefik

          ExecStart=/usr/bin/docker run \
            --name traefik \
            --restart unless-stopped \
            -p 80:80 \
            -p 443:443 \
            -p 8080:8080 \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -v /opt/traefik/acme.json:/etc/traefik/acme.json \
            -e AWS_REGION=${AWS::Region} \
            traefik:latest \
            --api.insecure=true \
            --providers.docker=true \
            --providers.docker.exposedByDefault=false \
            --entrypoints.web.address=:80 \
            --entrypoints.websecure.address=:443 \
            --entrypoints.web.http.redirections.entryPoint.to=websecure \
            --entrypoints.web.http.redirections.entryPoint.scheme=https \
            --certificatesresolvers.le.acme.httpchallenge=true \
            --certificatesresolvers.le.acme.httpchallenge.entrypoint=web \
            --certificatesresolvers.le.acme.email=${AcmeEmail} \
            --certificatesresolvers.le.acme.storage=/etc/traefik/acme.json \
            --entrypoints.websecure.transport.respondingtimeouts.readtimeout=3600s \
            --entrypoints.websecure.transport.respondingtimeouts.idletimeout=3600s

          ExecStop=/usr/bin/docker stop -t 20 traefik

          ExecStopPost=-/usr/bin/docker rm -f traefik
          ExecStopPost=-/usr/bin/aws s3 cp /opt/traefik/acme.json ${EnvFileS3URI}/acme.json 

          [Install]
          WantedBy=multi-user.target
          EOF
          
          # ================================
          
          cat >/etc/systemd/system/immich-api.service <<EOF
          [Unit]
          Description=Immich API
          Requires=docker.service
          After=docker.service network-online.target

          [Service]
          Type=simple
          Restart=always
          RestartSec=10

          ExecStartPre=-/usr/bin/docker rm -f immich-api

          ExecStart=/usr/bin/docker run \
            --name immich-api \
            --restart unless-stopped \
            --env-file /opt/scheduled/var.env \
            -e IMMICH_WORKERS_INCLUDE=api \
            --label "traefik.enable=true" \
            --label "traefik.http.routers.immich.rule=Host(\`${DomainName}\`)" \
            --label "traefik.http.routers.immich.entrypoints=websecure" \
            --label "traefik.http.routers.immich.tls.certresolver=le" \
            --label "traefik.http.services.immich.loadbalancer.server.port=2283" \
            -v /mnt/immich/upload:/usr/src/app/upload \
            ghcr.io/immich-app/immich-server:release

          ExecStop=/usr/bin/docker stop -t 60 immich-api
          ExecStopPost=/usr/bin/sync
          ExecStopPost=-/usr/bin/docker rm -f immich-api

          [Install]
          WantedBy=multi-user.target
          EOF

          systemctl daemon-reload
          systemctl enable traefik.service
          systemctl enable immich-api.service
          systemctl start traefik.service
          systemctl start immich-api.service
          
          echo "Adding crontab entry"
          echo "*/5 * * * * /opt/scheduled/microservice-cache-check.sh $BACKEND_SSM_PARAM_NAME $IMMICH_ECS_CLUSTER_NAME $IMMICH_ECS_WORKER_SERVICE_NAME $REDIS_HOSTNAME > /var/log/microservice-cache-check.log 2>&1" >> /tmp/mycrontab
          crontab /tmp/mycrontab
          
          crontab -l 
          
          echo "+++++++++++++ SETTING ROUTE 53 +++++++++++++"
          # 1. Fetch IMDSv2 Token & Public IP
          TOKEN=$(curl -s -S -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")
          PUBLIC_IP=$(curl -s -S -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/public-ipv4)

          # 2. Construct the Route 53 Change Batch Payload
          cat > /tmp/route53-change.json <<EOF
          {
            "Comment": "Auto-updating A record on instance boot",
            "Changes": [
              {
                "Action": "UPSERT",
                "ResourceRecordSet": {
                  "Name": "${DomainName}",
                  "Type": "A",
                  "TTL": 300,
                  "ResourceRecords": [
                    {
                      "Value": "$PUBLIC_IP"
                    }
                  ]
                }
              }
            ]
          }
          EOF

          # 3. Apply the update to Route 53
          aws route53 change-resource-record-sets \
            --hosted-zone-id "${HostedZoneId}" \
            --change-batch file:///tmp/route53-change.json
          
          echo "========= INIT COMPLETE ========"

Outputs:

  InstanceId:
    Value: !Ref ImmichAppInstance

  PublicIp:
    Value: !GetAtt ImmichAppInstance.PublicIp

  AvailabilityZone:
    Value: !GetAtt ImmichAppInstance.AvailabilityZone

  SecurityGroupId:
    Value: !Ref ImmichAppSG

  InstanceProfile:
    Value: !Ref ImmichAppInstanceProfile

  Role:
    Value: !Ref ImmichAppInstanceRole

  ApplicationURL:
    Description: Your secure application endpoint
    Value: !Sub "https://${DomainName}"