# samconfig.toml — Immich DB stacks (EBS + EC2)
# Deploy order: ebs stack first, then ec2 stack.
#
# Usage:
#   sam deploy --config-env ebs-prod   ← step 1
#   sam deploy --config-env ec2-prod   ← step 2 (fill EBSVolumeId from step 1 output)
#
# To deploy to a different environment, duplicate the env blocks and
# change the config-env name and parameter values accordingly.

version = 0.1

# ── EBS Stack ─────────────────────────────────────────────────────────────────
[ebs.deploy.parameters]
stack_name        = "immich-db-cache-ebs"
template_file     = "immich-db-cache-ebs.yaml"
region            = "ap-south-2"
capabilities      = "CAPABILITY_NAMED_IAM"
confirm_changeset = true
fail_on_empty_changeset = false

parameter_overrides = [
  "AvailabilityZone=ap-south-2a",
  "VolumeSize=30",
  "BackupRetentionDays=7"
]

# Tags applied to all resources in the stack
tags = [
  "Project=immich"
]

# ── EC2 ASG Stack ─────────────────────────────────────────────────────────────────

[ec2.deploy.parameters]
stack_name        = "immich-db-cache"
template_file     = "immich-db-cache-ec2.yaml"
region            = "ap-south-2"
capabilities      = "CAPABILITY_NAMED_IAM"
confirm_changeset = true
fail_on_empty_changeset = false
resolve_s3        = true
s3_prefix         = "immich-db-asg-handlers"

parameter_overrides = [
  "VpcId=vpc-09f10291c29a1a7cf",
  "InstanceType=t4g.small",
  "AllowedCIDR=10.0.0.0/16",
  "EnvFileS3URI=s3://immich-conf-ap-south-2-704678691702/immich.env",
  "KeyPair=immich",
  "SubnetId=subnet-0436d6552c6a53c4f",
  "ValkeyImage=ecr-public.aws.com/b4l2v8j6/immich/valkey:9",
  "PostgresImage=ecr-public.aws.com/b4l2v8j6/immich/postgres:14-vectorchord0.4.3",
  "VolumeId=vol-00fcfc88124c93032",
  "HostedZoneId=Z02289381ARPAOGOTJFBT",
  "RecordName=backend.ap-south-2.immich.internal",
  "ECSClusterName=immich-cluster",
  "ECSServiceNames=immich-api-service",
  "CronScriptsS3URI=s3://immich-conf-ap-south-2-704678691702/scripts"
]

tags = [
  "Project=immich"
]